<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>向日葵班班 · 學習存摺與親師生互動系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; color: black !important; }
      .page-break { page-break-inside: avoid; }
    }
    .print-only { display: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @keyframes heroFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    .hero-avatar-anim { animation: heroFloat 3.2s ease-in-out infinite; }
  </style>
</head>
<body class="bg-amber-50/40 text-slate-800 min-h-screen font-sans antialiased flex flex-col">

  <!-- ================= 頂部導覽列 ================= -->
  <header class="no-print bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('student'); playSound('click');">
        <div class="w-11 h-11 rounded-2xl overflow-hidden bg-white shadow-md border-2 border-white flex items-center justify-center flex-shrink-0">
          <span class="text-2xl">🌻</span>
        </div>
        <div>
          <h1 class="text-lg font-black tracking-wide flex items-center gap-1.5 drop-shadow-sm">向日葵班班 · 學習存摺</h1>
          <div class="flex items-center gap-2">
            <p class="text-xs text-amber-100 font-medium">作業追蹤 · 獎勵兌換</p>
            <span id="syncStatusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-white/20 text-white transition backdrop-blur-sm">
              <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span> 連線中...
            </span>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-2 text-sm">
        <div id="teacherNavControls" class="flex items-center space-x-2 bg-black/15 p-1 rounded-2xl backdrop-blur-sm border border-white/20">
          <button id="syncNowBtn" onclick="fetchFromGoogleSheets(true); playSound('click');" class="px-2.5 py-1.5 rounded-xl font-medium text-amber-100 hover:text-white hover:bg-white/20 transition flex items-center gap-1.5 text-xs">
            <i class="fa-solid fa-arrows-rotate" id="syncSpinner"></i> 同步試算表
          </button>
          <button id="navStudentBtn" onclick="switchView('student'); playSound('click');" class="px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1.5 bg-white text-orange-600 shadow-sm">
            <i class="fa-solid fa-mobile-screen"></i> 學生卡片
          </button>
          <button id="navAdminBtn" onclick="switchView('admin'); playSound('click');" class="px-3 py-1.5 rounded-xl font-medium transition flex items-center gap-1.5 text-amber-100 hover:text-white hover:bg-white/20">
            <i class="fa-solid fa-lock" id="adminLockIcon"></i> 教師後台
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 提示訊息 -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-700 max-w-sm">
      <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg flex-shrink-0"></i>
      <span id="toastMsg" class="text-xs sm:text-sm font-medium leading-tight">訊息</span>
    </div>
  </div>

  <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 md:p-8">

    <!-- ================= 視圖 1: 學生專屬查詢頁面 ================= -->
    <section id="studentView" class="block">
      
      <!-- 學生選擇器 (非個人模式顯示) -->
      <div id="studentSelectorBox" class="no-print mb-5 max-w-md mx-auto bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
          <i class="fa-solid fa-arrow-pointer text-amber-500 mr-1"></i> 切換學生 (預覽)
        </label>
        <select id="studentSelector" onchange="onStudentSelectChange(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"></select>
      </div>

      <!-- 學生卡片主體 -->
      <div id="studentCardContainer" class="max-w-md mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-amber-100 transform transition">
        
        <div class="bg-gradient-to-br from-amber-400 via-orange-400 to-rose-400 p-6 text-white text-center relative shadow-inner">
          <div class="absolute top-4 right-4 bg-white/25 backdrop-blur-md px-3 py-1 rounded-full text-xs font-black tracking-wider border border-white/30">
            <span id="cardSeatNumber">座號 01 號</span>
          </div>
          <div class="relative w-24 h-24 mx-auto mb-3 group">
            <div class="w-full h-full bg-white/95 backdrop-blur rounded-full p-1 shadow-md flex items-center justify-center text-5xl overflow-hidden border-2 border-white">
              <span id="cardAvatar" class="w-full h-full flex items-center justify-center">🌟</span>
            </div>
          </div>
          <h2 id="cardStudentName" class="text-2xl font-black tracking-tight drop-shadow-sm">讀取中...</h2>
          <p id="cardStudentId" class="text-xs text-amber-100 mt-1 font-mono font-bold">--</p>
        </div>

        <div class="p-6">
          <!-- 積分與等級區塊 -->
          <div class="mb-6 bg-gradient-to-b from-amber-50 to-orange-50/50 rounded-3xl p-5 border border-amber-200 text-center relative shadow-sm">
            <span class="inline-flex items-center gap-1 text-[11px] font-black bg-amber-200/80 text-amber-900 px-2.5 py-1 rounded-full mb-3">
              <i class="fa-solid fa-gamepad text-orange-600"></i> 冒險者學習存摺
            </span>
            <div class="flex items-center justify-center my-1">
              <span id="cardPoints" class="text-5xl font-black text-orange-600 tracking-tight">0</span>
              <span class="text-lg font-black text-amber-500 ml-2 self-end mb-1">PTS</span>
            </div>
          </div>

          <!-- 🌻 學生端 作業追蹤 -->
          <div class="mb-6 bg-gradient-to-b from-sky-50 to-indigo-50/60 rounded-3xl p-4 sm:p-5 border border-sky-200 shadow-sm">
            <div class="flex items-center justify-between mb-3">
              <span class="inline-flex items-center gap-1.5 text-xs font-black bg-sky-200/80 text-sky-900 px-3 py-1 rounded-full">
                <i class="fa-solid fa-book-open text-sky-600"></i> 班級作業任務
              </span>
            </div>
            <div id="studentHomeworkListContainer" class="space-y-2"></div>
          </div>

          <!-- 🌻 全新：學生端 定期評量成績區塊 (與作業分離，直接顯示) -->
          <div id="studentExamBlock" class="mb-6 bg-gradient-to-b from-purple-50 to-fuchsia-50/60 rounded-3xl p-4 sm:p-5 border border-purple-200 shadow-sm hidden">
            <div class="flex items-center justify-between mb-3">
              <span class="inline-flex items-center gap-1.5 text-xs font-black bg-purple-200/80 text-purple-900 px-3 py-1 rounded-full">
                <i class="fa-solid fa-medal text-purple-600"></i> <span id="studentExamTitleDisplay">期中評量成績單</span>
              </span>
            </div>
            <div id="studentExamScoreGrid" class="space-y-2 mb-3 bg-white/70 p-3.5 rounded-2xl border border-purple-100 shadow-2xs">
              <!-- JS 動態渲染成績 -->
            </div>
            <div class="bg-purple-100/50 p-3 rounded-xl border border-purple-200 text-xs text-purple-900">
              <span class="font-bold flex items-center gap-1 mb-1 text-purple-700"><i class="fa-solid fa-comment-heart"></i> 導師評語：</span>
              <p id="studentExamCommentDisplay" class="leading-relaxed">--</p>
            </div>
          </div>

          <!-- 相簿區塊 -->
          <div class="mb-6 bg-gradient-to-b from-rose-50 to-amber-50/60 rounded-3xl p-4 sm:p-5 border border-rose-200 shadow-sm">
            <div class="flex items-center justify-between mb-3">
              <span class="inline-flex items-center gap-1.5 text-xs font-black bg-rose-200/80 text-rose-900 px-3 py-1 rounded-full">
                <i class="fa-solid fa-folder-open text-rose-600"></i> 班級雲端相簿
              </span>
            </div>
            <div id="studentFoldersContainer" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 mb-2"></div>
          </div>

        </div>
      </div>
    </section>

    <!-- ================= 視圖 2: 教師後台 ================= -->
    <section id="adminView" class="hidden">
      <!-- 後台頂部控制列 -->
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-sliders text-orange-500"></i> 教師控制台</h2>
        <div class="flex gap-2">
          <button onclick="fetchFromGoogleSheets(true); playSound('click');" class="bg-amber-50 hover:bg-amber-100 text-amber-800 px-3 py-2 rounded-xl text-sm font-bold border border-amber-200"><i class="fa-solid fa-cloud-arrow-down"></i> 同步</button>
        </div>
      </div>

      <!-- 後台頁籤 -->
      <div class="flex space-x-2 border-b border-slate-200 mb-6 overflow-x-auto">
        <button id="adminTabStudentsBtn" onclick="switchAdminTab('students');" class="px-4 py-2.5 font-bold text-sm border-b-2 border-orange-500 text-orange-600 flex items-center gap-2 whitespace-nowrap">學生名單</button>
        <button id="adminTabHomeworkBtn" onclick="switchAdminTab('homework');" class="px-4 py-2.5 font-bold text-sm border-b-2 border-transparent text-slate-500 flex items-center gap-2 whitespace-nowrap">作業狀態</button>
        <button id="adminTabExamBtn" onclick="switchAdminTab('exam');" class="px-4 py-2.5 font-bold text-sm border-b-2 border-transparent text-slate-500 flex items-center gap-2 whitespace-nowrap">定期評量設定</button>
      </div>

      <!-- 學生名單管理 -->
      <div id="adminTabStudents" class="block">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 font-bold text-slate-500 text-xs">
                <th class="py-3 px-4">座號/學號</th><th class="py-3 px-4">姓名</th><th class="py-3 px-4 text-center">積分</th><th class="py-3 px-4 text-center">快速調整</th>
              </tr>
            </thead>
            <tbody id="adminStudentTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <!-- 作業狀態管理 -->
      <div id="adminTabHomework" class="hidden">
        <div id="adminHomeworkManagerContainer" class="space-y-4"></div>
      </div>

      <!-- 定期評量設定 -->
      <div id="adminTabExam" class="hidden">
        <div class="bg-amber-50 p-6 rounded-3xl border border-amber-200 mb-6">
          <div class="flex flex-col md:flex-row justify-between md:items-center gap-4">
            <div>
              <h3 class="text-lg font-bold text-amber-900 flex items-center gap-2"><i class="fa-solid fa-graduation-cap"></i> 評量成績公開設定</h3>
              <p class="text-xs text-amber-700 mt-1">控制學生卡片中是否顯示「成績區塊」。</p>
            </div>
            <div class="flex items-center gap-3 bg-white p-3 rounded-2xl border border-amber-300">
              <select id="adminExamSelectTitle" onchange="updateExamTitle(this.value)" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-700">
                <option value="期中定期評量">期中定期評量</option>
                <option value="期末定期評量">期末定期評量</option>
              </select>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="adminExamOpenToggle" onchange="toggleExamVisibility(this.checked)" class="accent-orange-500 w-5 h-5">
                <span class="text-sm font-bold text-slate-700" id="examToggleText">開放成績</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 🌻 作業提醒彈窗 (僅剩作業提醒，無成績分頁) -->
  <div id="integratedStatusModal" class="no-print fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full shadow-2xl border border-amber-200 overflow-hidden transform transition-all flex flex-col">
      <div class="p-5 text-center">
        <h3 class="text-base font-black text-slate-800 mb-2">作業尚未繳交提醒</h3>
        <p class="text-xs text-slate-500 mb-4" id="modalStudentInfoHW">學生資訊</p>
        <div id="modalHomeworkAlertList" class="space-y-2 mb-4 text-left"></div>
        <button onclick="closeIntegratedModal(); playSound('click');" class="w-full py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-sm rounded-xl">
          我知道了，我會趕快完成！💪
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 🚑 全域錯誤捕捉器 (防白畫面與快速除錯)
    // ==========================================
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const errorHTML = `
        <div style="position:fixed;top:0;left:0;width:100%;background:#fee2e2;color:#991b1b;padding:20px;z-index:99999;box-shadow:0 4px 6px rgba(0,0,0,0.1);font-family:sans-serif;">
          <h3 style="font-weight:bold;font-size:18px;margin-bottom:10px;">🚨 系統發生錯誤 (請截圖給開發者)</h3>
          <p><strong>錯誤訊息:</strong> ${msg}</p>
          <p><strong>位置:</strong> 第 ${lineNo} 行 , 欄位 ${columnNo}</p>
          <p><strong>詳細:</strong> ${error ? error.stack : '無'}</p>
          <p style="margin-top:15px;font-size:14px;color:#7f1d1d;">這通常是因為複製時漏掉程式碼。請重新將「完整修復版」的內容整份複製貼上。</p>
        </div>`;
      document.body.innerHTML = errorHTML + document.body.innerHTML;
      return false; // 讓錯誤繼續顯示在 Console 中
    };

    // 🌻 請務必確認這裡是您最新的 Google Apps Script 網址！
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxWQhC0bDnz4ITKoSGACvJeYlzDCGVOoYDMcoP3dIyAtBk5C1bpTajpj-R_xycdcBjW/exec";
    
    // 全域變數
    let students = [];
    let classHomeworks = [];
    let studentHomeworkStatus = {};
    let photoFolders = [];
    let classPhotos = [];
    let examConfig = { isOpen: false, examTitle: "期中評量" };
    let examMap = {};
    
    let currentStudentId = null;
    let isStudentPersonalMode = false;
    let isAdminAuthenticated = false;
    let hasShownIntegratedAlert = false; // 🐞 修正之前漏宣告的變數

    // 音效與動畫輔助
    function playSound(type) { /* 空實作防止報錯 */ }
    function showToast(msg, type='success') { 
      console.log(`[Toast] ${type}: ${msg}`);
      const t = document.getElementById('toast');
      const m = document.getElementById('toastMsg');
      if(t && m) { m.textContent = msg; t.classList.remove('translate-y-24', 'opacity-0'); setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 3000); }
    }

    // 視圖切換
    function switchView(view) {
      document.getElementById('studentView').classList.add('hidden');
      document.getElementById('adminView').classList.add('hidden');
      if (view === 'student') document.getElementById('studentView').classList.remove('hidden');
      if (view === 'admin') document.getElementById('adminView').classList.remove('hidden');
    }
    function switchAdminTab(tab) {
      ['Students', 'Homework', 'Exam'].forEach(t => {
        const el = document.getElementById(`adminTab${t}`);
        if(el) el.classList.add('hidden');
        const btn = document.getElementById(`adminTab${t}Btn`);
        if(btn) {
          btn.classList.replace('text-orange-600', 'text-slate-500');
          btn.classList.replace('border-orange-500', 'border-transparent');
        }
      });
      const tId = tab.charAt(0).toUpperCase() + tab.slice(1);
      const targetEl = document.getElementById(`adminTab${tId}`);
      if(targetEl) targetEl.classList.remove('hidden');
      const targetBtn = document.getElementById(`adminTab${tId}Btn`);
      if(targetBtn) {
        targetBtn.classList.replace('text-slate-500', 'text-orange-600');
        targetBtn.classList.replace('border-transparent', 'border-orange-500');
      }
    }

    // 核心渲染：學生卡片
    function renderStudentCard() {
      const student = students.find(s => String(s.id).toLowerCase() === String(currentStudentId).toLowerCase()) || students[0];
      if (!student) return;

      document.getElementById('cardSeatNumber').textContent = `座號 ${String(student.seat).padStart(2, '0')} 號`;
      document.getElementById('cardStudentName').textContent = student.name;
      document.getElementById('cardStudentId').textContent = `學號: ${student.id}`;
      document.getElementById('cardPoints').textContent = student.points;
      document.getElementById('cardAvatar').textContent = student.avatar || '🌟';

      renderStudentHomeworkList(student);
      renderStudentExamBlock(student);
      renderStudentFolders();
    }

    // 渲染：作業清單
    function renderStudentHomeworkList(student) {
      const container = document.getElementById('studentHomeworkListContainer');
      if (!container) return;
      container.innerHTML = '';
      if (classHomeworks.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400 text-center py-2">目前沒有作業</div>';
        return;
      }
      classHomeworks.forEach(hw => {
        const stObj = studentHomeworkStatus[String(student.id).toLowerCase()] || studentHomeworkStatus[student.id] || {};
        const st = stObj[hw.id] || 'missing';
        let bg = 'bg-white', tag = '未繳交', tagColor = 'bg-rose-500 text-white';
        if (st === 'done') { tag = '已繳交'; tagColor = 'bg-emerald-500 text-white'; bg = 'bg-emerald-50/50'; }
        else if (st === 'revise') { tag = '需訂正'; tagColor = 'bg-amber-500 text-white'; bg = 'bg-amber-50/50'; }
        container.innerHTML += `
          <div class="flex justify-between items-center p-3 rounded-xl border border-slate-200 ${bg}">
            <div>
              <div class="text-xs font-bold text-slate-800">${hw.title} <span class="text-[10px] text-slate-400 font-normal ml-1">期限: ${hw.dueDate}</span></div>
            </div>
            <span class="text-[10px] font-bold px-2 py-1 rounded shadow-xs ${tagColor}">${tag}</span>
          </div>`;
      });
    }

    // 渲染：成績區塊
    function renderStudentExamBlock(student) {
      const block = document.getElementById('studentExamBlock');
      if (!block) return;
      const examData = examMap[String(student.id).toLowerCase()] || examMap[String(student.seat)];
      
      if (!examConfig.isOpen || !examData) {
        block.classList.add('hidden');
        return;
      }
      block.classList.remove('hidden');
      document.getElementById('studentExamTitleDisplay').textContent = examConfig.examTitle + " 成績單";
      
      const grid = document.getElementById('studentExamScoreGrid');
      grid.innerHTML = '';
      const subs = [{k:'chinese', n:'國語'}, {k:'math', n:'數學'}, {k:'nature', n:'自然'}, {k:'social', n:'社會'}, {k:'english', n:'英語'}];
      let total = 0, count = 0;
      subs.forEach(s => {
        const sc = examData.scores[s.k] ?? '--';
        if(typeof sc === 'number' || (!isNaN(Number(sc)) && sc !== '')) { total += Number(sc); count++; }
        grid.innerHTML += `<div class="flex justify-between text-xs font-bold text-slate-700 py-1.5 border-b border-purple-100/50"><span>${s.n}</span><span class="${Number(sc)>=90?'text-emerald-600':'text-slate-700'} font-black">${sc} 分</span></div>`;
      });
      grid.innerHTML += `<div class="flex justify-between text-xs font-black text-purple-900 pt-2 mt-1 border-t border-purple-200"><span>總分: ${total}</span><span>平均: ${(count>0?(total/count).toFixed(1):'--')} 分</span></div>`;
      document.getElementById('studentExamCommentDisplay').textContent = examData.comment || "繼續保持，加油！";
    }

    // 渲染：相簿資料夾
    function renderStudentFolders() {
      const container = document.getElementById('studentFoldersContainer');
      if(!container) return;
      container.innerHTML = '';
      if(photoFolders.length === 0) {
        container.innerHTML = '<div class="col-span-2 text-center text-xs text-slate-400 py-4">尚無相簿資料夾</div>';
        return;
      }
      photoFolders.forEach(f => {
        container.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden cursor-pointer" onclick="alert('點擊了資料夾: ${f.name} (示意)')">
            <div class="h-20 bg-slate-100 flex items-center justify-center overflow-hidden">
              <img src="${f.coverUrl}" class="w-full h-full object-cover" onerror="this.style.display='none'">
            </div>
            <div class="p-2 text-center">
              <div class="text-[11px] font-bold text-slate-700 truncate">${f.name}</div>
              <div class="text-[9px] text-slate-400">${f.photoCount} 張</div>
            </div>
          </div>`;
      });
    }

    // 渲染：後台學生清單
    function renderAdminTable() {
      const tbody = document.getElementById('adminStudentTableBody');
      if(!tbody) return;
      tbody.innerHTML = '';
      students.forEach(s => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-2.5 px-4 text-xs font-mono font-bold text-slate-500">${s.seat} / ${s.id}</td>
            <td class="py-2.5 px-4 text-sm font-bold text-slate-800">${s.name}</td>
            <td class="py-2.5 px-4 text-center"><span class="bg-orange-100 text-orange-800 px-2 py-0.5 rounded font-black">${s.points}</span></td>
            <td class="py-2.5 px-4 text-center">
               <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs font-bold" onclick="alert('加分功能示意')">+ 點數</button>
            </td>
          </tr>`;
      });
    }

    // 教師後台切換評量開關
    function toggleExamVisibility(isOpen) {
      examConfig.isOpen = isOpen;
      document.getElementById('adminExamOpenToggle').checked = isOpen;
      document.getElementById('examToggleText').textContent = isOpen ? '成績已開放' : '成績未開放';
      renderStudentCard();
      sendDataToGoogleSheets({ action: 'updateExamConfig', isOpen: isOpen, examTitle: examConfig.examTitle });
      showToast(`已${isOpen ? '開放' : '關閉'}成績查詢！`, 'success');
    }
    function updateExamTitle(title) {
      examConfig.examTitle = title;
      renderStudentCard();
      sendDataToGoogleSheets({ action: 'updateExamConfig', isOpen: examConfig.isOpen, examTitle: title });
    }

    // 登入時檢查是否有欠交作業
    function checkIntegratedAlertOnLogin(student) {
      if (!student || hasShownIntegratedAlert) return;
      let hasMissingHw = false;
      const hwListBox = document.getElementById('modalHomeworkAlertList');
      if(hwListBox) hwListBox.innerHTML = '';
      
      classHomeworks.forEach(hw => {
        const stObj = studentHomeworkStatus[String(student.id).toLowerCase()] || studentHomeworkStatus[student.id] || {};
        const st = stObj[hw.id] || 'missing';
        if (st === 'missing' || st === 'revise') {
          hasMissingHw = true;
          if(hwListBox) hwListBox.innerHTML += `
            <div class="flex justify-between items-center p-2.5 rounded border ${st === 'revise' ? 'bg-amber-50 border-amber-200' : 'bg-rose-50 border-rose-200'}">
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded text-white ${st === 'revise' ? 'bg-amber-500' : 'bg-rose-500'}">${st === 'revise' ? '需訂正' : '未繳交'}</span>
              <span class="text-xs font-bold text-slate-800 ml-1">${hw.title}</span>
            </div>`;
        }
      });
      if(document.getElementById('modalStudentInfoHW')) document.getElementById('modalStudentInfoHW').textContent = `學生：${student.name} (#${String(student.seat).padStart(2,'0')})`;
      if (hasMissingHw) {
        hasShownIntegratedAlert = true;
        document.getElementById('integratedStatusModal').classList.remove('hidden');
      }
    }
    function closeIntegratedModal() { document.getElementById('integratedStatusModal').classList.add('hidden'); }
    function onStudentSelectChange(sid) { currentStudentId = sid; renderStudentCard(); }

    // API 連線與資料讀取
    async function fetchFromGoogleSheets(showFeedback = false) {
      const badge = document.getElementById('syncStatusBadge');
      if(badge) { badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span> 連線中...'; badge.classList.replace('bg-rose-500/80', 'bg-white/20'); }
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 45000); 
        const res = await fetch(`${GAS_API_URL}?_t=${Date.now()}`, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        
        if (data.students) students = data.students;
        if (data.homeworks) classHomeworks = data.homeworks;
        if (data.homeworkStatus) studentHomeworkStatus = data.homeworkStatus;
        if (data.photoFolders) photoFolders = data.photoFolders;
        if (data.examConfig) examConfig = data.examConfig;
        if (data.examMap) examMap = data.examMap;

        // 更新選擇器
        const selector = document.getElementById('studentSelector');
        if (selector) {
          selector.innerHTML = students.map(s => `<option value="${s.id}">${s.seat}. ${s.name}</option>`).join('');
          if(!currentStudentId && students.length > 0) currentStudentId = students[0].id;
          selector.value = currentStudentId;
        }

        renderStudentCard();
        renderAdminTable();
        
        document.getElementById('adminExamOpenToggle').checked = examConfig.isOpen;
        document.getElementById('adminExamSelectTitle').value = examConfig.examTitle;
        document.getElementById('examToggleText').textContent = examConfig.isOpen ? '成績已開放' : '成績未開放';

        if(badge) { badge.innerHTML = '<i class="fa-solid fa-check text-emerald-300"></i> 已連線'; }
        if (showFeedback) showToast('資料已成功與雲端同步！', 'success');

        if (isStudentPersonalMode && currentStudentId) {
          const st = students.find(s => String(s.id).toLowerCase() === String(currentStudentId).toLowerCase());
          if (st) checkIntegratedAlertOnLogin(st);
        }

      } catch (err) {
        console.warn("同步失敗:", err);
        if(badge) { badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-white"></i> 連線逾時'; badge.classList.replace('bg-white/20', 'bg-rose-500/80'); }
        if (showFeedback) showToast('雲端連線逾時，切換為本地暫存資料', 'error');
      }
    }

    function sendDataToGoogleSheets(payload) {
      fetch(GAS_API_URL, {
        method: 'POST', mode: 'no-cors', cache: 'no-cache',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.error("寫入背景請求失敗:", err));
    }

    function initApp() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlSid = params.get('sid');
        if (urlSid) {
          isStudentPersonalMode = true;
          currentStudentId = urlSid;
          document.getElementById('studentSelectorBox').classList.add('hidden');
        }
      } catch(e){}
      fetchFromGoogleSheets(false);
    }
    
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
